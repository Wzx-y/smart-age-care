name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:integration
      - run: npm run build

  e2e-readiness:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - run: |
          echo "Playwright suite will be enabled after the first cloud-side dependency lock update."
          echo "Do not treat this readiness marker as an end-to-end test pass."

  backend-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn --batch-mode --file backend/pom.xml verify

  ruoyi-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUOYI_JWT_SECRET: ci-only-${{ github.sha }}-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn --batch-mode --file backend/ruoyi-cloud/pom.xml verify
