name: Preview Deployment

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      vars.ENABLE_VERCEL_DEPLOY == 'true'
    runs-on: ubuntu-latest
    environment: preview
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npx --yes vercel@40.2.0 pull --yes --environment=preview --token="${{ secrets.VERCEL_TOKEN }}"
      - run: npx --yes vercel@40.2.0 build --token="${{ secrets.VERCEL_TOKEN }}"
      - id: deploy
        run: echo "url=$(npx --yes vercel@40.2.0 deploy --prebuilt --token=\"${{ secrets.VERCEL_TOKEN }}\")" >> "$GITHUB_OUTPUT"
      - run: curl --fail --retry 3 --retry-delay 5 "${{ steps.deploy.outputs.url }}"

  preview-not-configured:
    if: github.event.pull_request.head.repo.full_name == github.repository && vars.ENABLE_VERCEL_DEPLOY != 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo "Preview deployment is awaiting Vercel authorization and ENABLE_VERCEL_DEPLOY=true."
