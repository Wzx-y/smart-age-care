name: smart-age-care

services:
  ruoyi-mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ry-cloud
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      CARE_DB_USERNAME: ${CARE_DB_USERNAME:?CARE_DB_USERNAME is required}
      CARE_DB_PASSWORD: ${CARE_DB_PASSWORD:?CARE_DB_PASSWORD is required}
      RUOYI_DB_USERNAME: ${RUOYI_DB_USERNAME:?RUOYI_DB_USERNAME is required}
      RUOYI_DB_PASSWORD: ${RUOYI_DB_PASSWORD:?RUOYI_DB_PASSWORD is required}
      NACOS_DB_USERNAME: ${NACOS_DB_USERNAME:?NACOS_DB_USERNAME is required}
      NACOS_DB_PASSWORD: ${NACOS_DB_PASSWORD:?NACOS_DB_PASSWORD is required}
    command: ["mysqld", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/00-init.sh:/docker-entrypoint-initdb.d/00-init.sh:ro
      - ../../backend/ruoyi-cloud/sql:/seed/ruoyi:ro
    ports:
      - "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  ruoyi-redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  ruoyi-nacos:
    image: nacos/nacos-server:v3.0.2
    environment:
      MODE: standalone
      SPRING_DATASOURCE_PLATFORM: mysql
      NACOS_AUTH_ENABLE: "true"
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN_SECRET:?NACOS_AUTH_TOKEN_SECRET is required}
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_SERVER_IDENTITY_KEY:?NACOS_SERVER_IDENTITY_KEY is required}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_SERVER_IDENTITY_VALUE:?NACOS_SERVER_IDENTITY_VALUE is required}
      NACOS_DB_USERNAME: ${NACOS_DB_USERNAME:?NACOS_DB_USERNAME is required}
      NACOS_DB_PASSWORD: ${NACOS_DB_PASSWORD:?NACOS_DB_PASSWORD is required}
    depends_on:
      ruoyi-mysql:
        condition: service_healthy
    volumes:
      - ../../backend/ruoyi-cloud/docker/nacos/conf/application.properties:/home/nacos/conf/application.properties:ro
    ports:
      - "127.0.0.1:8848:8848"
      - "127.0.0.1:9848:9848"
      - "127.0.0.1:9849:9849"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/v3/console/health/readiness >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30

volumes:
  mysql-data:
  redis-data:
